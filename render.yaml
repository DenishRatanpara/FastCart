services:
  # Next.js Web Application
  - type: web
    name: fastcart-frontend
    env: node
    rootDir: fastcart
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false      
      - key: CLOUDINARY_CLOUD_API
        sync: false
      - key: CLOUDINARY_CLOUD_SECREY_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Environment Variable Links between services
      - key: NEXT_BASE_URL
        value: https://fastcart-frontend.onrender.com
      - key: NEXT_PUBLIC_SOCKET_SERVER
        value: https://fastcart-socket.onrender.com
    
  # Node.js WebSocket Server
  - type: web
    name: fastcart-socket
    env: node
    rootDir: socketServer
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NEXT_BASE_URL
        value: https://fastcart-frontend.onrender.com
